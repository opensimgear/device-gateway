name: Independent gateway and device integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  multi-device-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check dependency bootstrap retry and snapshot behavior
        run: python3 -m unittest discover -s tests/e2e -p 'test_*.py'
      - name: Clone dependencies, build and run gateway E2E
        run: python3 tests/e2e/run.py --sanitize
      - name: Retain source manifest and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-e2e
          path: |
            .e2e/resolved-dependencies.json
            .e2e/runs/
