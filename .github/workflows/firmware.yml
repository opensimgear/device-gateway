name: Device gateway firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pico-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OSG_COVERAGE_CLANG: clang-18
      OSG_LLVM_COV: llvm-cov-18
      OSG_LLVM_PROFDATA: llvm-profdata-18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Pico build and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends cmake gcc-arm-none-eabi libnewlib-arm-none-eabi clang-18 llvm-18
      - name: Build pinned RP2040 debug target and audit memory
        run: node simulation/pico/firmware/build.mjs
      - name: Sanitized firmware, interrupted flash and coverage tests
        run: node simulation/pico/firmware/test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pico-debug-firmware
          path: |
            .research/pico/build/osg-pico-gateway.uf2
            .research/pico/build/osg-pico-gateway.uf2.sha256
            .research/pico/build/firmware-manifest.json
            .research/pico/build/memory-audit.json
  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure gateway, flash journal and Cyphal transport tests
        working-directory: firmware
        run: cmake --preset native
      - name: Build and test
        working-directory: firmware
        run: |
          cmake --build --preset native --parallel
          ctest --preset native
      - name: Check native Cyphal SocketCAN peer and Cockpit snapshots
        env:
          OSG_GATEWAY_TEST: .build/native/osg_gateway_test
          OSG_CYPHAL_PEER_LIBRARY: .build/native/libosg_gateway_peer.so
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Action routing coverage above 70 percent
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-18 llvm-18
          python3 firmware/tests/coverage.py --clang clang-18 --llvm-cov llvm-cov-18 --llvm-profdata llvm-profdata-18
  board-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Arm GNU compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure compile-only STM32G0B1CB build
        # Unallocated test placeholders: never flash or distribute these USB IDs.
        working-directory: firmware
        run: cmake --preset gateway -DOSG_USB_VID=0xFFFF -DOSG_USB_PID=0xFFFF
      - name: Build ELF, HEX and binary
        working-directory: firmware
        run: cmake --build --preset gateway --parallel
